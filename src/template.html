<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <header class="header"></header>
        <aside class="aside">
            <section class="projectHeading">
                <h2>PROJECTS</h2>
            </section>
            <section class="project-create">
                <button id="createProjectBtn">+ New Project</button>
            </section>
            <section class="project-list"></section>
        </aside>
        <main class="main"></main>
        <footer class="footer"></footer>
    </div>

    <div id="modalProject" class="modal hidden">
        <div class="modal-content">
            <form action="">
                <div class="form-row">
                    <h2>Create New Project</h2>
                </div>

                <div class="form-row">
                    <label for="projectName">Project Name</label>
                    <input type="text" name="projectName" id="projectName">
                </div>

                <div class="form-row">
                    <div class="btn-group">
                        <button id="addProject" type="submit">Add Project</button>
                        <button id="closeModal" type="button">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
       
</body>
</html>
