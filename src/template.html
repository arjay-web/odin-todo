<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <header class="header"></header>
        <aside class="aside">
            <section class="projectHeading">
                <h2>PROJECTS</h2>
            </section>
            <section class="btnContainer">
                <button id="createProjectBtn">+ New Project</button>
            </section>
            <section class="projectContainer">
                <div id="projectList"></div>
            </section>
        </aside>
        <main class="main">

        </main>
        <footer class="footer"></footer>
    </div>

    <div id="projectModal" class="modal hidden">
        <div class="modal-content">
            <form action="" id="projectForm">
                <div class="form-row">
                    <h2>Create New Project</h2>
                </div>

                <div class="form-row">
                    <label for="projectName">Project Name</label>
                    <input type="text" name="projectName" id="projectName">
                </div>

                <div class="form-row">
                    <div class="btn-group">
                        <button id="addProject" type="submit">Add Project</button>
                        <button id="closeModal" type="button">Cancel</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div id="todoModal" class="modal hidden">
        <div class="modal-content">
            <form action="" id="todoForm">
                <div class="form-row">
                    <label for="taskTitle">TASK TITLE</label>
                    <input type="text" name="" id="taskTitle" required>
                </div>
                <div class="form-row">
                    <label for="desc">DESCRIPTION</label>
                    <textarea name="" id="desc" required></textarea>
                </div>
                <div class="form-row">
                    <label for="dueDate">DUE DATE</label>
                    <input type="date" name="" id="dueDate" required>
                </div>
                <div class="form-row">
                    <select name="" id="priority">
                        <option value="low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="form-row">
                    <button id="closeTaskModal" type="button">Cancel</button>
                    <button type="submit">Create Task</button>
                </div>
            </form>
        </div>
    </div>
    <div id="taskDetailModal" class="modal hidden">
        <div class="taskDetails">
            <div class="detailHeader">
                <span>PROJECT: <span class="renderTitle"></span> </span>
                <button class="closeDetail">X</button>
            </div>

            <div class="detailContent">
                <div class="metaItem">
                    <label>STATUS</label>
                    <div class="statusBox">
                        <span class="renderStatus"></span>
                    </div>
                </div>
                <div class="metaItem">
                    <label>DUE DATE</label>
                    <div class="dateBox">
                        <span class="renderDate"></span>
                    </div>
                </div>
                <div class="metaItem">
                    <label>PRIORITY</label>
                    <div class="priorityBox">
                        <span class="renderPriority"></span>
                    </div>
                </div>
            </div>

            <div class="descSection">
                <div class="descHeader">
                    <span>DESCCRIPTION</span>
                </div>
                <p class="taskDescription"></p>
            </div>

        </div>
    </div>
</body>

</html>
